name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and attach downloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Zip the extension
        run: cd extension/dist && zip -r "../../OwlCept-extension-${GITHUB_REF_NAME}.zip" .
      - name: Zip the web checker
        run: cd web/dist && zip -r "../../OwlCept-check-web-${GITHUB_REF_NAME}.zip" .
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "OwlCept-android-${GITHUB_REF_NAME}-debug.apk"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "OwlCept $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" OwlCept-*.zip OwlCept-*.apk --clobber
